<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GymTracker</title>

    
</head>

<body>
    <div class="caixa">
        <h1>Login</h1>

        <label>Email</label>
        <input type="email" id="email">

        <label>Senha</label>
        <input type="password" id="senha">

        <button onclick="login()">
    Entrar
</button>

        <div class="links">
            <button class="botao-secundario"
                onclick="window.location.href='cadastro.html'">
                Cadastrar-se
            </button>

            <button class="botao-secundario"
                onclick="window.location.href='index.html'">
                Voltar
            </button>
        </div>
    </div>
<script>
    function login() {

        let email = document.getElementById("email").value;
        let senha = document.getElementById("senha").value;

        let usuario = JSON.parse(localStorage.getItem("usuario"));

        if (!usuario) {
            alert("Nenhum usuário cadastrado!");
            return;
        }

        if (email === usuario.email && senha === usuario.senha) {

            localStorage.setItem("usuarioLogado", usuario.nome);

            window.location.href = "dashboard.html";
        }
        else {
            alert("Email ou senha inválidos!");
        }

    }
</script>

<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .caixa {
            width: 400px;
            background: #1d1d1d;
            padding: 40px;
            border-radius: 25px;
        }

        h1 {
            text-align: center;
            color: #ff6b00;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 20px;
            border: none;
            border-radius: 10px;
            background: #2b2b2b;
            color: white;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background: #ff6b00;
            color: white;
            cursor: pointer;
        }

        .botao-secundario {
            width: 160px;
            padding: 12px;
            font-size: 14px;
            border: none;
            border-radius: 20px;
            background: #ff6b00;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #ff7f26;
            transition: 0.3s;
        }

        a {
            color: #ff6b00;
            text-decoration: none;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
    </style>
</body>

</html>

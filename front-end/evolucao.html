<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolução - GymTracker</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/ui.css">

    <style>
        .evolucao-card p {
            line-height: 1.8;
        }

        .peso-grande {
            display: flex;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .peso-grande strong {
            font-size: 40px;
            color: white;
        }

        .peso-grande small {
            color: #aaa;
            font-size: 18px;
        }

        .variacao {
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 14px;
            font-weight: 600;
        }

        .variacao.subiu {
            background: rgba(67, 160, 71, .15);
            color: #81c784;
        }

        .variacao.caiu {
            background: rgba(198, 40, 40, .15);
            color: #ef9a9a;
        }

        .variacao.manteve {
            background: #2b2b2b;
            color: #bbb;
        }

        .observacao {
            margin-top: 10px;
            color: #aaa;
            font-style: italic;
        }
    </style>
</head>

<body>

    <header>

        <a href="dashboard.html" class="logo">
            GYMTRACKER
        </a>

        <nav>

            <button class="menu-btn"
                onclick="window.location.href='treinos.html'">
                Treinos
            </button>

            <button class="menu-btn"
                onclick="window.location.href='exercicios.html'">
                Exercícios
            </button>

            <button class="menu-btn ativo"
                onclick="window.location.href='evolucao.html'">
                Evolução
            </button>

        </nav>

        <button class="perfil-btn"
            onclick="window.location.href='perfil.html'">

            👤 <span id="boasVindas">Perfil</span>

        </button>

    </header>

    <main>

    <h1 class="page-title">
        Minha <span>Evolução</span>
    </h1>

    <p class="descricao">
        Acompanhe sua progressão, registre cargas e visualize sua evolução
        nos exercícios ao longo da sua jornada fitness.
    </p>

    <div class="actions">

        <select id="filtroExercicio" class="filtro" aria-label="Filtrar por exercício">
            <option value="">Todos os exercícios</option>
        </select>

        <button
            class="create-btn"
            id="novoRegistro">

            + Novo Registro

        </button>
    </div>

    <div
        class="evolucao-grid"
        id="listaEvolucao">

        <p class="carregando">Carregando registros...</p>

    </div>

</main>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>

exigirLogin();
mostrarNomeUsuario();

const listaEvolucao =
    document.getElementById("listaEvolucao");

const filtroExercicio =
    document.getElementById("filtroExercicio");

let registros = [];
let exercicios = [];


// ==========================================
// EXERCÍCIOS (para o select)
// Antes era preciso digitar o ID na mão
// ==========================================

async function carregarExercicios() {

    exercicios = await api("/exercicios");

    filtroExercicio.innerHTML =
        `<option value="">Todos os exercícios</option>` +
        exercicios.map(exercicio => `
            <option value="${exercicio.id}">
                ${escaparHTML(exercicio.nome)} (${escaparHTML(exercicio.treino_nome)})
            </option>
        `).join("");
}

filtroExercicio.addEventListener("change", carregarEvolucao);


// ==========================================
// LISTAR
// ==========================================

function montarVariacao(diferenca) {

    if (diferenca === null || diferenca === undefined) {
        return `<span class="variacao manteve">Primeiro registro</span>`;
    }

    const valor = Number(diferenca);

    if (valor > 0) {
        return `<span class="variacao subiu">▲ +${valor.toLocaleString("pt-BR")} kg</span>`;
    }

    if (valor < 0) {
        return `<span class="variacao caiu">▼ ${valor.toLocaleString("pt-BR")} kg</span>`;
    }

    return `<span class="variacao manteve">= mesma carga</span>`;
}

async function carregarEvolucao() {

    try {

        const filtro = filtroExercicio.value
            ? `?exercicio_id=${filtroExercicio.value}`
            : "";

        registros = await api(`/evolucao${filtro}`);

        if (registros.length === 0) {

            listaEvolucao.innerHTML = `
                <div class="sem-dados">
                    <h2>Nenhum registro encontrado</h2>
                    <p>${exercicios.length === 0
                        ? "Cadastre um exercício primeiro para registrar suas cargas."
                        : "Clique em \"+ Novo Registro\" para começar."}</p>
                </div>
            `;

            return;
        }

        listaEvolucao.innerHTML = registros.map(registro => `

            <div class="evolucao-card">

                <span class="etiqueta">${escaparHTML(registro.treino_nome)}</span>

                <h2>
                    ${escaparHTML(registro.exercicio_nome)}
                </h2>

                <div class="peso-grande">
                    <strong>${Number(registro.peso).toLocaleString("pt-BR")} <small>kg</small></strong>
                    ${montarVariacao(registro.diferenca)}
                </div>

                <p>
                    📅 ${formatarData(registro.data_registro)}
                </p>

                ${registro.observacao
                    ? `<p class="observacao">📝 ${escaparHTML(registro.observacao)}</p>`
                    : ""}

                <div class="acoes">

                    <button
                        class="btn-editar"
                        onclick="editarEvolucao(${registro.id})">
                        Editar
                    </button>

                    <button
                        class="btn-excluir"
                        onclick="excluirEvolucao(${registro.id})">
                        Excluir
                    </button>

                </div>

            </div>

        `).join("");

    } catch (erro) {

        listaEvolucao.innerHTML = `
            <div class="sem-dados">
                <h2>Erro ao carregar</h2>
                <p>${escaparHTML(erro.message)}</p>
            </div>
        `;

    }

}


// ==========================================
// CAMPOS DO MODAL
// ==========================================

function camposEvolucao(registro = {}) {

    return [
        {
            nome: "exercicio_id",
            rotulo: "Exercício",
            tipo: "select",
            obrigatorio: true,
            valor: registro.exercicio_id ?? filtroExercicio.value,
            opcoes: exercicios.map(e => ({
                valor: e.id,
                texto: `${e.nome} (${e.treino_nome})`
            }))
        },
        {
            linha: [
                {
                    nome: "peso",
                    rotulo: "Carga (kg)",
                    tipo: "number",
                    obrigatorio: true,
                    min: 0,
                    max: 999.99,
                    step: 0.25,
                    placeholder: "Ex: 40",
                    valor: registro.peso !== undefined ? Number(registro.peso) : ""
                },
                {
                    nome: "data_registro",
                    rotulo: "Data",
                    tipo: "date",
                    obrigatorio: true,
                    max: dataHojeISO(),
                    valor: registro.data_registro ?? dataHojeISO()
                }
            ]
        },
        {
            nome: "observacao",
            rotulo: "Observação",
            tipo: "textarea",
            maxlength: 300,
            placeholder: "Ex: Última série até a falha",
            valor: registro.observacao
        }
    ];
}

function converterValores(valores) {

    return {
        ...valores,
        peso: Number(valores.peso),
        exercicio_id: Number(valores.exercicio_id)
    };
}


// ==========================================
// CRIAR
// ==========================================

document
.getElementById("novoRegistro")
.addEventListener("click", async () => {

    if (exercicios.length === 0) {

        await confirmarAcao({
            titulo: "Nenhum exercício ainda",
            mensagem: "Para registrar uma carga você precisa ter pelo menos um exercício cadastrado.",
            textoConfirmar: "Cadastrar exercício",
            perigo: false,
            aoConfirmar: async () => {
                window.location.href = "exercicios.html";
            }
        });

        return;
    }

    await abrirFormulario({
        titulo: "Novo Registro",
        campos: camposEvolucao(),
        textoConfirmar: "Registrar",
        aoSalvar: async (valores) => {

            await api("/evolucao", {
                method: "POST",
                body: converterValores(valores)
            });

            mostrarToast("Carga registrada!");
            carregarEvolucao();
        }
    });

});


// ==========================================
// EDITAR (antes o botão não fazia nada)
// ==========================================

async function editarEvolucao(id) {

    const registro = registros.find(r => r.id === id);

    if (!registro) return;

    await abrirFormulario({
        titulo: "Editar Registro",
        campos: camposEvolucao(registro),
        textoConfirmar: "Salvar alterações",
        aoSalvar: async (valores) => {

            await api(`/evolucao/${id}`, {
                method: "PUT",
                body: converterValores(valores)
            });

            mostrarToast("Registro atualizado!");
            carregarEvolucao();
        }
    });

}


// ==========================================
// EXCLUIR
// ==========================================

async function excluirEvolucao(id) {

    const registro = registros.find(r => r.id === id);

    if (!registro) return;

    await confirmarAcao({
        titulo: "Excluir registro?",
        mensagem: `O registro de <strong>${Number(registro.peso).toLocaleString("pt-BR")} kg</strong>
            em <strong>${escaparHTML(registro.exercicio_nome)}</strong>
            do dia <strong>${formatarData(registro.data_registro)}</strong> será apagado.`,
        textoConfirmar: "Sim, excluir",
        aoConfirmar: async () => {

            await api(`/evolucao/${id}`, {
                method: "DELETE"
            });

            mostrarToast("Registro excluído.");
            carregarEvolucao();
        }
    });

}


// ==========================================
// INÍCIO
// ==========================================

carregarExercicios()
    .then(carregarEvolucao)
    .catch((erro) => {
        listaEvolucao.innerHTML = `
            <div class="sem-dados">
                <h2>Erro ao carregar</h2>
                <p>${escaparHTML(erro.message)}</p>
            </div>
        `;
    });

</script>

</body>

</html>

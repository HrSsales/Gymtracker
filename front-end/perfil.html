<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - GymTracker</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            background:#121212;
            color:white;
        }

        /* HEADER */

        header{

            position:sticky;
            top:0;

            z-index:999;

            height:90px;

            background:#121212;

            border-bottom:2px solid #ff6b00;

            display:flex;

            justify-content:space-between;

            align-items:center;

            padding:0 40px;

        }

        .logo{

            color:#ff6b00;

            text-decoration:none;

            font-size:34px;

            font-weight:bold;

            letter-spacing:2px;

        }

        nav{

            position:absolute;

            left:50%;

            transform:translateX(-50%);

            display:flex;

            gap:15px;

        }

        .menu-btn{

            background:#1d1d1d;

            color:white;

            border:1px solid transparent;

            border-radius:30px;

            padding:12px 22px;

            cursor:pointer;

            transition:.3s;

        }

        .menu-btn:hover{

            color:#ff6b00;

            border-color:#ff6b00;

        }

        .perfil-btn{

            background:#ff6b00;

            color:white;

            border:none;

            border-radius:30px;

            padding:12px 22px;

            cursor:pointer;

        }

        /* CONTEÚDO */

        main{

            max-width:1200px;

            margin:0 auto;

            padding:60px 20px;

        }

        .perfil-topo{

            text-align:center;

            margin-bottom:50px;

        }

        .avatar{

            width:120px;
            height:120px;

            border-radius:50%;

            background:#1d1d1d;

            border:3px solid #ff6b00;

            display:flex;

            justify-content:center;

            align-items:center;

            font-size:50px;

            margin:0 auto 20px;

        }

        .nome{

            font-size:34px;

            margin-bottom:10px;
        }

        .email{

            color:#c7c7c7;

            font-size:18px;
        }

        /* ESTATÍSTICAS */

        .stats{

            display:flex;

            justify-content:center;

            flex-wrap:wrap;

            gap:20px;

            margin-bottom:50px;

        }

        .stat-card{

            width:220px;

            background:#1d1d1d;

            border-radius:20px;

            padding:25px;

            text-align:center;

            border:2px solid transparent;

            transition:.3s;

        }

        .stat-card:hover{

            border-color:#ff6b00;

            transform:translateY(-5px);

        }

        .stat-card h3{

            color:#ff6b00;

            margin-bottom:10px;

        }

        .stat-card span{

            font-size:26px;

            font-weight:bold;

        }

        /* FORMULÁRIO */

        .perfil-card{

            max-width:700px;

            margin:0 auto;

            background:#1d1d1d;

            border-radius:25px;

            padding:35px;

        }

        .perfil-card h2{

            color:#ff6b00;

            margin-bottom:25px;

        }

        .campo{

            margin-bottom:20px;

        }

        .campo label{

            display:block;

            margin-bottom:8px;

        }

        .campo input{

            width:100%;

            padding:15px;

            border:none;

            border-radius:15px;

            background:#2b2b2b;

            color:white;

        }

        .botoes{

            display:flex;

            gap:15px;

            margin-top:30px;

        }

        .salvar-btn{

            background:#ff6b00;

            color:white;

            border:none;

            border-radius:30px;

            padding:15px 30px;

            cursor:pointer;

            transition:.3s;

        }

        .salvar-btn:hover{

            transform:scale(1.03);

        }

        .logout-btn{

            background:transparent;

            color:white;

            border:1px solid #d32f2f;

            border-radius:30px;

            padding:15px 30px;

            cursor:pointer;

            transition:.3s;

        }

        .logout-btn:hover{

            background:#d32f2f;

        }

    </style>

</head>

<body>

    <header>

        <a href="dashboard.html" class="logo">
            GYMTRACKER
        </a>

        <nav>

            <button class="menu-btn"
                onclick="window.location.href='treinos.html'">
                Treinos
            </button>

            <button class="menu-btn"
                onclick="window.location.href='exercicios.html'">
                Exercícios
            </button>

            <button class="menu-btn"
                onclick="window.location.href='evolucao.html'">
                Evolução
            </button>

        </nav>

        <button class="perfil-btn">
            👤 Perfil
        </button>

    </header>

    <main>

       <section class="perfil-topo">

    <div class="avatar">
        👤
    </div>

    <h1 class="nome" id="nomeUsuario">
        Carregando...
    </h1>

    <p class="email" id="emailUsuario">
        Carregando...
    </p>

    <p class="membro-desde" id="dataCadastro">
        Membro desde: --
    </p>

</section>

        <section class="stats">

            <div class="stat-card">
    <h3>Treinos</h3>
    <span id="qtdTreinos">0</span>
</div>

<div class="stat-card">
    <h3>Exercícios</h3>
    <span id="qtdExercicios">0</span>
</div>

<div class="stat-card">
    <h3>Evoluções</h3>
    <span id="qtdEvolucoes">0</span>
</div>
        </section>

        <section class="perfil-card">

    <h2>Informações da Conta</h2>

    <div class="campo">
        <label>Nome</label>
        <input
            type="text"
            id="inputNome"
            readonly
        >
    </div>

    <div class="campo">
        <label>Email</label>
        <input
            type="email"
            id="inputEmail"
            readonly
        >
    </div>

    <div class="campo">
        <label>Senha</label>
        <input
            type="password"
            value="********"
            readonly
        >
    </div>

    <div class="botoes">

        <button class="salvar-btn">
            Editar Perfil
        </button>

        <button
            class="logout-btn"
            onclick="sair()"
        >
            Sair da Conta
        </button>

    </div>

</section>

    </main>

<script>

async function carregarPerfil() {

    const usuarioId = localStorage.getItem("usuarioId");

    if (!usuarioId) {
        window.location.href = "login.html";
        return;
    }

    try {

        const resposta = await fetch(
            `http://localhost:3000/perfil/${usuarioId}`
        );

        const usuario = await resposta.json();

        document.getElementById("nomeUsuario").textContent =
            usuario.nome;

        document.getElementById("emailUsuario").textContent =
            usuario.email;

        document.getElementById("inputNome").value =
            usuario.nome;

        document.getElementById("inputEmail").value =
            usuario.email;

        const data = new Date(usuario.created_at);

        document.getElementById("dataCadastro").textContent =
            "Membro desde: " +
            data.toLocaleDateString("pt-BR");

    } catch (erro) {

        console.error("Erro ao carregar perfil:", erro);

    }

}

async function carregarEstatisticas() {

    const usuarioId = localStorage.getItem("usuarioId");

    try {

        const resposta = await fetch(
            `http://localhost:3000/stats/${usuarioId}`
        );

        const stats = await resposta.json();

        console.log("Stats recebidas:", stats);

        document.getElementById("qtdTreinos").textContent =
            stats.treinos || 0;

        document.getElementById("qtdExercicios").textContent =
            stats.exercicios || 0;

        document.getElementById("qtdEvolucoes").textContent =
            stats.evolucoes || 0;

    } catch (erro) {

        console.error("Erro ao carregar estatísticas:", erro);

        document.getElementById("qtdTreinos").textContent = 0;
        document.getElementById("qtdExercicios").textContent = 0;
        document.getElementById("qtdEvolucoes").textContent = 0;

    }

}

function sair() {

    localStorage.removeItem("usuarioLogado");
    localStorage.removeItem("usuarioId");

    window.location.href = "index.html";

}

carregarPerfil();
carregarEstatisticas();

</script>

</body>

</html>

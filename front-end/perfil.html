<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - GymTracker</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/ui.css">

    <style>
        main {
            max-width: 1200px;
            padding: 60px 20px;
        }

        .perfil-topo {
            text-align: center;
            margin-bottom: 50px;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #1d1d1d;
            border: 3px solid #ff6b00;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 50px;
            font-weight: bold;
            color: #ff6b00;
            margin: 0 auto 20px;
            box-shadow: 0 0 25px rgba(255, 107, 0, .25);
        }

        .nome {
            font-size: 34px;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .email {
            color: #c7c7c7;
            font-size: 18px;
            word-break: break-word;
        }

        .membro-desde {
            color: #888;
            margin-top: 8px;
        }

        /* ESTATÍSTICAS */

        .stats {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 50px;
        }

        .stat-card {
            width: 220px;
            background: #1d1d1d;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            border: 2px solid transparent;
            transition: .3s;
        }

        .stat-card:hover {
            border-color: #ff6b00;
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #ff6b00;
            margin-bottom: 10px;
        }

        .stat-card span {
            font-size: 26px;
            font-weight: bold;
        }

        /* INFORMAÇÕES */

        .perfil-card {
            max-width: 700px;
            margin: 0 auto;
            background: #1d1d1d;
            border-radius: 25px;
            padding: 35px;
        }

        .perfil-card h2 {
            color: #ff6b00;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            color: #c7c7c7;
        }

        .campo input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 15px;
            background: #2b2b2b;
            color: white;
            cursor: default;
        }

        .botoes {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
        }

        .salvar-btn {
            background: #ff6b00;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 15px 30px;
            cursor: pointer;
            transition: .3s;
        }

        .salvar-btn:hover {
            transform: scale(1.03);
        }

        .logout-btn {
            background: transparent;
            color: white;
            border: 1px solid #d32f2f;
            border-radius: 30px;
            padding: 15px 30px;
            cursor: pointer;
            transition: .3s;
        }

        .logout-btn:hover {
            background: #d32f2f;
        }

        /* ZONA DE PERIGO */

        .zona-perigo {
            max-width: 700px;
            margin: 30px auto 0;
            border: 1px solid rgba(198, 40, 40, .4);
            border-radius: 25px;
            padding: 25px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .zona-perigo h3 {
            color: #ef5350;
            margin-bottom: 5px;
        }

        .zona-perigo p {
            color: #aaa;
            font-size: 14px;
        }

        .excluir-conta-btn {
            background: transparent;
            color: #ef5350;
            border: 1px solid #c62828;
            border-radius: 30px;
            padding: 12px 24px;
            cursor: pointer;
            transition: .3s;
        }

        .excluir-conta-btn:hover {
            background: #c62828;
            color: white;
        }

        @media (max-width: 600px) {

            .perfil-card,
            .zona-perigo {
                padding: 25px;
            }

            .botoes button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <header>

        <a href="dashboard.html" class="logo">
            GYMTRACKER
        </a>

        <nav>

            <button class="menu-btn"
                onclick="window.location.href='treinos.html'">
                Treinos
            </button>

            <button class="menu-btn"
                onclick="window.location.href='exercicios.html'">
                Exercícios
            </button>

            <button class="menu-btn"
                onclick="window.location.href='evolucao.html'">
                Evolução
            </button>

        </nav>

        <button class="perfil-btn"
            onclick="window.location.href='perfil.html'">

            👤 <span id="boasVindas">Perfil</span>

        </button>

    </header>

    <main>

        <section class="perfil-topo">

            <div class="avatar" id="avatar">
                👤
            </div>

            <h1 class="nome" id="nomeUsuario">
                Carregando...
            </h1>

            <p class="email" id="emailUsuario">
                Carregando...
            </p>

            <p class="membro-desde" id="dataCadastro">
                Membro desde: --
            </p>

        </section>

        <section class="stats">

            <div class="stat-card">
                <h3>Treinos</h3>
                <span id="qtdTreinos">0</span>
            </div>

            <div class="stat-card">
                <h3>Exercícios</h3>
                <span id="qtdExercicios">0</span>
            </div>

            <div class="stat-card">
                <h3>Evoluções</h3>
                <span id="qtdEvolucoes">0</span>
            </div>

        </section>

        <section class="perfil-card">

            <h2>Informações da Conta</h2>

            <div class="campo">
                <label for="inputNome">Nome</label>
                <input type="text" id="inputNome" readonly>
            </div>

            <div class="campo">
                <label for="inputEmail">Email</label>
                <input type="email" id="inputEmail" readonly>
            </div>

            <div class="campo">
                <label for="inputSenha">Senha</label>
                <input type="password" id="inputSenha" value="********" readonly>
            </div>

            <div class="botoes">

                <button class="salvar-btn" onclick="editarPerfil()">
                    Editar Perfil
                </button>

                <button class="logout-btn" onclick="confirmarSaida()">
                    Sair da Conta
                </button>

            </div>

        </section>

        <section class="zona-perigo">

            <div>
                <h3>Excluir conta</h3>
                <p>Apaga sua conta e todos os seus treinos, exercícios e registros.</p>
            </div>

            <button class="excluir-conta-btn" onclick="excluirConta()">
                Excluir minha conta
            </button>

        </section>

    </main>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>

exigirLogin();
mostrarNomeUsuario();

let usuarioAtual = null;

function preencherPerfil(usuario) {

    usuarioAtual = usuario;

    document.getElementById("nomeUsuario").textContent = usuario.nome;
    document.getElementById("emailUsuario").textContent = usuario.email;
    document.getElementById("inputNome").value = usuario.nome;
    document.getElementById("inputEmail").value = usuario.email;
    document.getElementById("avatar").textContent =
        usuario.nome.trim().charAt(0).toUpperCase();

    document.getElementById("dataCadastro").textContent =
        "Membro desde: " +
        new Date(usuario.created_at).toLocaleDateString("pt-BR");
}

async function carregarPerfil() {

    try {

        const usuario = await api("/perfil");

        preencherPerfil(usuario);

    } catch (erro) {

        mostrarToast(erro.message, "erro");

    }
}

async function carregarEstatisticas() {

    try {

        const stats = await api("/stats");

        document.getElementById("qtdTreinos").textContent = stats.treinos;
        document.getElementById("qtdExercicios").textContent = stats.exercicios;
        document.getElementById("qtdEvolucoes").textContent = stats.evolucoes;

    } catch (erro) {

        console.error("Erro ao carregar estatísticas:", erro);

    }
}

/* ==========================================
   EDITAR PERFIL (antes o botão não fazia nada)
========================================== */

async function editarPerfil() {

    if (!usuarioAtual) return;

    await abrirFormulario({
        titulo: "Editar Perfil",
        mensagem: "Para trocar a senha, preencha a senha atual e a nova. Se não quiser trocar, deixe em branco.",
        campos: [
            {
                nome: "nome",
                rotulo: "Nome",
                obrigatorio: true,
                maxlength: 100,
                autocomplete: "name",
                valor: usuarioAtual.nome
            },
            {
                nome: "email",
                rotulo: "Email",
                tipo: "email",
                obrigatorio: true,
                maxlength: 150,
                autocomplete: "email",
                valor: usuarioAtual.email
            },
            {
                nome: "senha_atual",
                rotulo: "Senha atual",
                tipo: "password",
                autocomplete: "current-password"
            },
            {
                linha: [
                    {
                        nome: "nova_senha",
                        rotulo: "Nova senha",
                        tipo: "password",
                        minlength: 6,
                        maxlength: 72,
                        autocomplete: "new-password"
                    },
                    {
                        nome: "confirmar_senha",
                        rotulo: "Confirmar nova senha",
                        tipo: "password",
                        autocomplete: "new-password"
                    }
                ]
            }
        ],
        textoConfirmar: "Salvar",
        aoSalvar: async (valores) => {

            if (valores.nova_senha !== valores.confirmar_senha) {
                throw new Error("A confirmação não bate com a nova senha.");
            }

            if (valores.nova_senha && !valores.senha_atual) {
                throw new Error("Informe a senha atual para trocar a senha.");
            }

            const dados = await api("/perfil", {
                method: "PUT",
                body: {
                    nome: valores.nome,
                    email: valores.email,
                    senha_atual: valores.senha_atual || undefined,
                    nova_senha: valores.nova_senha || undefined
                }
            });

            salvarSessao(dados.token, dados.usuario);
            preencherPerfil(dados.usuario);
            mostrarNomeUsuario();

            mostrarToast("Perfil atualizado!");
        }
    });
}

/* ==========================================
   SAIR
========================================== */

async function confirmarSaida() {

    await confirmarAcao({
        titulo: "Sair da conta?",
        mensagem: "Você vai precisar fazer login de novo para acessar seus treinos.",
        textoConfirmar: "Sair",
        aoConfirmar: async () => {
            sair();
        }
    });
}

/* ==========================================
   EXCLUIR CONTA (pede a senha para confirmar)
========================================== */

async function excluirConta() {

    await abrirFormulario({
        titulo: "Excluir sua conta?",
        mensagem: "Todos os seus <strong>treinos, exercícios e registros de evolução</strong> serão apagados para sempre. Digite sua senha para confirmar.",
        perigo: true,
        campos: [
            {
                nome: "senha",
                rotulo: "Senha",
                tipo: "password",
                obrigatorio: true,
                autocomplete: "current-password"
            }
        ],
        textoConfirmar: "Excluir para sempre",
        aoSalvar: async (valores) => {

            await api("/perfil", {
                method: "DELETE",
                body: { senha: valores.senha }
            });

            limparSessao();
            window.location.href = "index.html";
        }
    });
}

carregarPerfil();
carregarEstatisticas();

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GymTracker</title>
    <link rel="stylesheet" href="css/ui.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .caixa {
            width: 400px;
            background: #1d1d1d;
            padding: 40px;
            border-radius: 25px;
        }

        h1 {
            text-align: center;
            color: #ff6b00;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 20px;
            border: none;
            border-radius: 10px;
            background: #2b2b2b;
            color: white;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 30px;
            background: #ff6b00;
            color: white;
            cursor: pointer;
        }

        .botao-secundario {
            width: 160px;
            padding: 12px;
            font-size: 14px;
            border: none;
            border-radius: 20px;
            background: #ff6b00;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #ff7f26;
            transition: 0.3s;
        }

        a {
            color: #ff6b00;
            text-decoration: none;
        }

        input:focus {
            outline: 2px solid #ff6b00;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .mensagem-erro {
            min-height: 20px;
            margin: -8px 0 12px;
            color: #ff8a80;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .caixa {
                width: calc(100% - 32px);
                padding: 30px 22px;
            }

            .links {
                flex-direction: column;
                align-items: center;
            }
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="caixa">
        <h1>Login</h1>

        <form id="formLogin" novalidate>

            <label for="email">Email</label>
            <input type="email" id="email" autocomplete="email" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" autocomplete="current-password" required>

            <p class="mensagem-erro" id="mensagemErro" role="alert"></p>

            <button type="submit" id="botaoEntrar">
                Entrar
            </button>

        </form>

        <div class="links">
            <button class="botao-secundario"
                onclick="window.location.href='cadastro.html'">
                Cadastrar-se
            </button>

            <button class="botao-secundario"
                onclick="window.location.href='index.html'">
                Voltar
            </button>
        </div>
    </div>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>

// Se já está logado, vai direto pro dashboard
if (getToken()) {
    window.location.replace("dashboard.html");
}

const formLogin = document.getElementById("formLogin");
const mensagemErro = document.getElementById("mensagemErro");
const botaoEntrar = document.getElementById("botaoEntrar");

function mostrarErro(texto) {
    mensagemErro.textContent = texto;
}

formLogin.addEventListener("submit", login);

async function login(evento) {

    evento.preventDefault();

    const email = document.getElementById("email").value.trim();
    const senha = document.getElementById("senha").value;

    mostrarErro("");

    if (!email || !senha) {
        mostrarErro("Preencha email e senha.");
        return;
    }

    botaoEntrar.disabled = true;
    botaoEntrar.textContent = "Entrando...";

    try {

        const dados = await api("/login", {
            method: "POST",
            body: { email, senha }
        });

        salvarSessao(dados.token, dados.usuario);

        window.location.href = "dashboard.html";

    } catch (erro) {

        mostrarErro(erro.message);

        botaoEntrar.disabled = false;
        botaoEntrar.textContent = "Entrar";
    }

}
</script>


</body>

</html>

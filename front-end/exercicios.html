<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios - GymTracker</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/ui.css">

    <style>
        .detalhe-linha {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #2b2b2b;
        }

        .detalhe-linha:last-child {
            border-bottom: none;
        }

        .detalhe-linha strong {
            color: white;
        }
    </style>
</head>

<body>

    <header>

        <a href="dashboard.html" class="logo">
            GYMTRACKER
        </a>

        <nav>

            <button class="menu-btn"
                onclick="window.location.href='treinos.html'">
                Treinos
            </button>

            <button class="menu-btn ativo"
                onclick="window.location.href='exercicios.html'">
                Exercícios
            </button>

            <button class="menu-btn"
                onclick="window.location.href='evolucao.html'">
                Evolução
            </button>

        </nav>

        <button class="perfil-btn"
            onclick="window.location.href='perfil.html'">

            👤 <span id="boasVindas">Perfil</span>

        </button>

    </header>

<main>

    <h1 class="page-title">
        Meus <span>Exercícios</span>
    </h1>

    <p class="descricao">
        Cadastre e organize todos os exercícios dos seus treinos.
    </p>

    <div class="actions">

        <select id="filtroTreino" class="filtro" aria-label="Filtrar por treino">
            <option value="">Todos os treinos</option>
        </select>

        <button
            class="create-btn"
            id="novoExercicio">

            + Novo Exercício
        </button>
    </div>

    <div
        class="exercicios-grid"
        id="listaExercicios">

        <p class="carregando">Carregando exercícios...</p>

    </div>

</main>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>

exigirLogin();
mostrarNomeUsuario();

const listaExercicios =
document.getElementById("listaExercicios");

const filtroTreino =
document.getElementById("filtroTreino");

let exercicios = [];
let treinos = [];
let grupos = [];


// ==========================================
// CARREGAR TREINOS E GRUPOS (para os selects)
// ==========================================

async function carregarOpcoes() {

    [treinos, grupos] = await Promise.all([
        api("/treinos"),
        api("/exercicios/grupos")
    ]);

    filtroTreino.innerHTML =
        `<option value="">Todos os treinos</option>` +
        treinos.map(treino => `
            <option value="${treino.id}">${escaparHTML(treino.nome)}</option>
        `).join("");

    // Veio da página de treinos com ?treino=ID
    const treinoDaUrl = new URLSearchParams(location.search).get("treino");

    if (treinoDaUrl && treinos.some(t => String(t.id) === treinoDaUrl)) {
        filtroTreino.value = treinoDaUrl;
    }
}

filtroTreino.addEventListener("change", () => {

    const url = new URL(location.href);

    if (filtroTreino.value) {
        url.searchParams.set("treino", filtroTreino.value);
    } else {
        url.searchParams.delete("treino");
    }

    history.replaceState(null, "", url);

    carregarExercicios();
});


// ==========================================
// LISTAR
// ==========================================

async function carregarExercicios() {

    try {

        const filtro = filtroTreino.value
            ? `?treino_id=${filtroTreino.value}`
            : "";

        exercicios = await api(`/exercicios${filtro}`);

        if (exercicios.length === 0) {

            listaExercicios.innerHTML = `
                <div class="sem-dados">
                    <h2>Nenhum exercício cadastrado</h2>
                    <p>${treinos.length === 0
                        ? "Crie um treino primeiro, depois adicione os exercícios nele."
                        : "Clique em \"+ Novo Exercício\" para adicionar o primeiro."}</p>
                </div>
            `;

            return;
        }

        listaExercicios.innerHTML = exercicios.map(exercicio => `

            <div class="exercicio-card">

                <span class="etiqueta">${escaparHTML(exercicio.treino_nome)}</span>

                <h2>${escaparHTML(exercicio.nome)}</h2>

                <p>

                    <span class="detalhe-linha">
                        Grupo <strong>${escaparHTML(exercicio.grupo_muscular)}</strong>
                    </span>

                    <span class="detalhe-linha">
                        Séries <strong>${exercicio.series}</strong>
                    </span>

                    <span class="detalhe-linha">
                        Repetições <strong>${exercicio.repeticoes}</strong>
                    </span>

                </p>

                <div class="acoes">

                    <button
                        class="btn-editar"
                        onclick="editarExercicio(${exercicio.id})"
                    >
                        Editar
                    </button>

                    <button
                        class="btn-excluir"
                        onclick="excluirExercicio(${exercicio.id})"
                    >
                        Excluir
                    </button>

                </div>

            </div>

        `).join("");

    } catch (erro) {

        listaExercicios.innerHTML = `
            <div class="sem-dados">
                <h2>Erro ao carregar</h2>
                <p>${escaparHTML(erro.message)}</p>
            </div>
        `;

    }

}


// ==========================================
// CAMPOS DO MODAL
// ==========================================

function camposExercicio(exercicio = {}) {

    return [
        {
            nome: "treino_id",
            rotulo: "Treino",
            tipo: "select",
            obrigatorio: true,
            valor: exercicio.treino_id ?? filtroTreino.value,
            opcoes: treinos.map(t => ({ valor: t.id, texto: t.nome }))
        },
        {
            nome: "nome",
            rotulo: "Nome do exercício",
            obrigatorio: true,
            maxlength: 100,
            placeholder: "Ex: Supino reto",
            valor: exercicio.nome
        },
        {
            nome: "grupo_muscular",
            rotulo: "Grupo muscular",
            tipo: "select",
            obrigatorio: true,
            valor: exercicio.grupo_muscular,
            opcoes: grupos.map(g => ({ valor: g, texto: g }))
        },
        {
            linha: [
                {
                    nome: "series",
                    rotulo: "Séries",
                    tipo: "number",
                    obrigatorio: true,
                    min: 1,
                    max: 20,
                    step: 1,
                    valor: exercicio.series ?? 3
                },
                {
                    nome: "repeticoes",
                    rotulo: "Repetições",
                    tipo: "number",
                    obrigatorio: true,
                    min: 1,
                    max: 100,
                    step: 1,
                    valor: exercicio.repeticoes ?? 12
                }
            ]
        }
    ];
}

function converterNumeros(valores) {

    return {
        ...valores,
        treino_id: Number(valores.treino_id),
        series: Number(valores.series),
        repeticoes: Number(valores.repeticoes)
    };
}


// ==========================================
// CRIAR
// ==========================================

document
.getElementById("novoExercicio")
.addEventListener("click", async () => {

    if (treinos.length === 0) {

        await confirmarAcao({
            titulo: "Nenhum treino ainda",
            mensagem: "Todo exercício pertence a um treino. Crie um treino primeiro.",
            textoConfirmar: "Criar treino",
            perigo: false,
            aoConfirmar: async () => {
                window.location.href = "treinos.html";
            }
        });

        return;
    }

    await abrirFormulario({
        titulo: "Novo Exercício",
        campos: camposExercicio(),
        textoConfirmar: "Adicionar",
        aoSalvar: async (valores) => {

            await api("/exercicios", {
                method: "POST",
                body: converterNumeros(valores)
            });

            mostrarToast("Exercício adicionado!");
            carregarExercicios();
        }
    });

});


// ==========================================
// EDITAR
// ==========================================

async function editarExercicio(id) {

    const exercicio = exercicios.find(e => e.id === id);

    if (!exercicio) return;

    await abrirFormulario({
        titulo: "Editar Exercício",
        campos: camposExercicio(exercicio),
        textoConfirmar: "Salvar alterações",
        aoSalvar: async (valores) => {

            await api(`/exercicios/${id}`, {
                method: "PUT",
                body: converterNumeros(valores)
            });

            mostrarToast("Exercício atualizado!");
            carregarExercicios();
        }
    });

}


// ==========================================
// EXCLUIR
// ==========================================

async function excluirExercicio(id) {

    const exercicio = exercicios.find(e => e.id === id);

    if (!exercicio) return;

    await confirmarAcao({
        titulo: "Excluir exercício?",
        mensagem: `<strong>${escaparHTML(exercicio.nome)}</strong> será removido do treino
            <strong>${escaparHTML(exercicio.treino_nome)}</strong>, junto com os registros de evolução dele.
            <br><br>Essa ação não pode ser desfeita.`,
        textoConfirmar: "Sim, excluir",
        aoConfirmar: async () => {

            await api(`/exercicios/${id}`, {
                method: "DELETE"
            });

            mostrarToast("Exercício removido.");
            carregarExercicios();
        }
    });

}


// ==========================================
// INÍCIO
// ==========================================

carregarOpcoes()
    .then(carregarExercicios)
    .catch((erro) => {
        listaExercicios.innerHTML = `
            <div class="sem-dados">
                <h2>Erro ao carregar</h2>
                <p>${escaparHTML(erro.message)}</p>
            </div>
        `;
    });

</script>

</body>

</html>

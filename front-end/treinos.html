<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinos - GymTracker</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/ui.css">

    <style>
        .ver-exercicios {
            align-self: flex-start;
            margin-top: 18px;
            color: #ff9d57;
            text-decoration: none;
            font-size: 15px;
            transition: .3s;
        }

        .ver-exercicios:hover {
            color: #ff6b00;
            transform: translateX(4px);
        }
    </style>
</head>

<body>

    <header>

        <a href="dashboard.html" class="logo">
            GYMTRACKER
        </a>

        <nav>

            <button class="menu-btn ativo"
                onclick="window.location.href='treinos.html'">
                Treinos
            </button>

            <button class="menu-btn"
                onclick="window.location.href='exercicios.html'">
                Exercícios
            </button>

            <button class="menu-btn"
                onclick="window.location.href='evolucao.html'">
                Evolução
            </button>

        </nav>

        <button class="perfil-btn"
            onclick="window.location.href='perfil.html'">

            👤 <span id="boasVindas">Perfil</span>

        </button>

    </header>

    <main>

        <h1 class="page-title">
            Meus <span>Treinos</span>
        </h1>

        <p class="descricao">
            Crie, organize e gerencie suas fichas de treino.
        </p>

        <div class="actions">

            <button
                class="create-btn"
                onclick="novoTreino()">

                + Novo Treino

            </button>

        </div>

        <div
            id="treinosGrid"
            class="treinos-grid">

            <p class="carregando">Carregando treinos...</p>

        </div>

    </main>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script>

exigirLogin();
mostrarNomeUsuario();

// Guarda a lista para usar nos modais (sem passar texto no onclick)
let treinos = [];

document.addEventListener(
    "DOMContentLoaded",
    carregarTreinos
);

async function carregarTreinos() {

    const grid =
        document.getElementById(
            "treinosGrid"
        );

    try {

        treinos = await api("/treinos");

        if (treinos.length === 0) {

            grid.innerHTML = `
                <div class="sem-dados">
                    <h2>Nenhum treino cadastrado</h2>
                    <p>Clique em "+ Novo Treino" para criar sua primeira ficha.</p>
                </div>
            `;

            return;
        }

        grid.innerHTML = treinos.map(treino => `
            <div class="treino-card">

                <span class="etiqueta">
                    ${treino.total_exercicios}
                    ${treino.total_exercicios === 1 ? "exercício" : "exercícios"}
                </span>

                <h2>${escaparHTML(treino.nome)}</h2>

                <p>
                    ${escaparHTML(treino.descricao) || "Sem descrição"}
                </p>

                <a class="ver-exercicios"
                    href="exercicios.html?treino=${treino.id}">
                    Ver exercícios →
                </a>

                <div class="acoes">

                    <button
                        class="btn-editar"
                        onclick="editarTreino(${treino.id})">
                        Editar
                    </button>

                    <button
                        class="btn-excluir"
                        onclick="excluirTreino(${treino.id})">
                        Excluir
                    </button>

                </div>

            </div>
        `).join("");

    } catch (erro) {

        grid.innerHTML = `
            <div class="sem-dados">
                <h2>Erro ao carregar</h2>
                <p>${escaparHTML(erro.message)}</p>
            </div>
        `;

    }

}

function camposTreino(treino = {}) {

    return [
        {
            nome: "nome",
            rotulo: "Nome do treino",
            obrigatorio: true,
            maxlength: 100,
            placeholder: "Ex: Treino A - Peito e Tríceps",
            valor: treino.nome
        },
        {
            nome: "descricao",
            rotulo: "Descrição",
            tipo: "textarea",
            maxlength: 500,
            placeholder: "Ex: Segunda e quinta, foco em hipertrofia",
            valor: treino.descricao
        }
    ];
}

async function novoTreino() {

    await abrirFormulario({
        titulo: "Novo Treino",
        campos: camposTreino(),
        textoConfirmar: "Criar treino",
        aoSalvar: async (valores) => {

            await api("/treinos", {
                method: "POST",
                body: valores
            });

            mostrarToast("Treino criado com sucesso!");
            carregarTreinos();
        }
    });

}

async function editarTreino(id) {

    const treino = treinos.find(t => t.id === id);

    if (!treino) return;

    await abrirFormulario({
        titulo: "Editar Treino",
        campos: camposTreino(treino),
        textoConfirmar: "Salvar alterações",
        aoSalvar: async (valores) => {

            await api(`/treinos/${id}`, {
                method: "PUT",
                body: valores
            });

            mostrarToast("Treino atualizado!");
            carregarTreinos();
        }
    });

}

async function excluirTreino(id) {

    const treino = treinos.find(t => t.id === id);

    if (!treino) return;

    const aviso = treino.total_exercicios > 0
        ? `<br><br>Os <strong>${treino.total_exercicios} exercícios</strong> deste treino e todos os registros de evolução deles também serão apagados.`
        : "";

    await confirmarAcao({
        titulo: "Excluir treino?",
        mensagem: `Você está prestes a excluir <strong>${escaparHTML(treino.nome)}</strong>.${aviso}<br><br>Essa ação não pode ser desfeita.`,
        textoConfirmar: "Sim, excluir",
        aoConfirmar: async () => {

            await api(`/treinos/${id}`, {
                method: "DELETE"
            });

            mostrarToast("Treino excluído.");
            carregarTreinos();
        }
    });

}

</script>

</body>

</html>

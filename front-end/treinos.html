<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinos - GymTracker</title>
</head>

<body>

    <header>

        <a href="dashboard.html" class="logo">
            GYMTRACKER
        </a>

        <nav>

            <button class="menu-btn"
                onclick="window.location.href='treinos.html'">
                Treinos
            </button>

            <button class="menu-btn"
                onclick="window.location.href='exercicios.html'">
                Exercícios
            </button>

            <button class="menu-btn"
                onclick="window.location.href='evolucao.html'">
                Evolução
            </button>

        </nav>

        <button class="perfil-btn"
            onclick="window.location.href='perfil.html'">

            👤 Perfil

        </button>

    </header>

    <main>

        <h1 class="page-title">
            Meus <span>Treinos</span>
        </h1>

        <p class="descricao">
            Crie, organize e gerencie suas fichas de treino.
        </p>

        <div class="actions">

            <button
                class="create-btn"
                onclick="novoTreino()">

                + Novo Treino

            </button>

        </div>

        <div
            id="treinosGrid"
            class="treinos-grid">

        </div>

    </main>

<script>

const API_URL = "http://localhost:3000/treinos";

document.addEventListener(
    "DOMContentLoaded",
    carregarTreinos
);

async function carregarTreinos() {

    const usuarioId =
        localStorage.getItem("usuarioId");

    if (!usuarioId) {
        return;
    }

    try {

        const resposta =
            await fetch(
                `${API_URL}/${usuarioId}`
            );

        const treinos =
            await resposta.json();

        const grid =
            document.getElementById(
                "treinosGrid"
            );

        grid.innerHTML = "";

        if (treinos.length === 0) {

            grid.innerHTML =
                "<p class='sem-dados'>Nenhum treino cadastrado.</p>";

            return;
        }

        treinos.forEach(treino => {

            grid.innerHTML += `
                <div class="treino-card">

                    <h3>${treino.nome}</h3>

                    <p>
                        ${treino.descricao || "Sem descrição"}
                    </p>

                    <div class="acoes">

                        <button
                            class="btn-editar"
                            onclick="editarTreino(${treino.id})">
                            Editar
                        </button>

                        <button
                            class="btn-excluir"
                            onclick="excluirTreino(${treino.id})">
                            Excluir
                        </button>

                    </div>

                </div>
            `;
        });

    } catch (erro) {

        console.error(erro);

    }

}

async function novoTreino() {

    const nome =
        prompt("Nome do treino:");

    if (!nome) return;

    const descricao =
        prompt("Descrição do treino:");

    const usuario_id =
        localStorage.getItem("usuarioId");

    try {

        await fetch(
            API_URL,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                    nome,
                    descricao,
                    usuario_id
                })
            }
        );

        carregarTreinos();

    } catch (erro) {

        console.error(erro);

    }

}

async function editarTreino(id) {

    const nome =
        prompt("Novo nome:");

    if (!nome) return;

    const descricao =
        prompt("Nova descrição:");

    try {

        await fetch(
            `${API_URL}/${id}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                    nome,
                    descricao
                })
            }
        );

        carregarTreinos();

    } catch (erro) {

        console.error(erro);

    }

}

async function excluirTreino(id) {

    const confirmar =
        confirm(
            "Deseja excluir este treino?"
        );

    if (!confirmar) return;

    try {

        await fetch(
            `${API_URL}/${id}`,
            {
                method: "DELETE"
            }
        );

        carregarTreinos();

    } catch (erro) {

        console.error(erro);

    }

}

</script>


</body>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#121212;
    color:white;
}

    position:sticky;
    top:0;
    z-index:999;

    background:#121212;

    height:100px;

    border-bottom:2px solid #ff6b00;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 50px;
}

.logo{
    text-decoration:none;
    color:#ff6b00;
    font-size:34px;
    font-weight:bold;
}

nav{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:15px;
}

.menu-btn{
    background:#1d1d1d;
    color:white;
    border:none;
    border-radius:30px;
    padding:15px 25px;
    cursor:pointer;
    transition:.3s;
}

.menu-btn:hover{
    color:#ff6b00;
}

.perfil-btn{
    background:#ff6b00;
    color:white;
    border:none;
    border-radius:30px;
    padding:15px 25px;
    cursor:pointer;
    transition:.3s;
}

.create-btn{
    background:#ff6b00;
    color:white;
    border:none;
    border-radius:30px;
    padding:15px 30px;
    cursor:pointer;
}

main{
    max-width:1400px;
    margin:auto;
    padding:60px 20px;
}

.page-title{
    text-align:center;
    font-size:58px;
}

.page-title span{
    color:#ff6b00;
}

.descricao{
    text-align:center;
    color:#cfcfcf;
    margin:20px auto 50px;
}

.actions{
    display:flex;
    justify-content:center;
    margin-bottom:40px;
}

.treinos-grid{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:25px;
}

.treino-card{
    width:350px;
    background:#1d1d1d;
    padding:25px;
    border-radius:20px;
    transition:.3s;
}

.treino-card:hover{
    border:1px solid #ff6b00;
}

.treino-card h3{
    color:#ff6b00;
    margin-bottom:10px;
}

.treino-card p{
    color:#d6d6d6;
}

.acoes{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.btn-editar{
    flex:1;
    background:#ff6b00;
    color:white;
    border:none;
    border-radius:20px;
    padding:10px;
    cursor:pointer;
}

.btn-excluir{
    flex:1;
    background:#c62828;
    color:white;
    border:none;
    border-radius:20px;
    padding:10px;
    cursor:pointer;
}

.sem-dados{
    color:#888;
    text-align:center;
    width:100%;
}

</style>

</html>
